<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NDOLI App Developer & Bar Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; padding: 1.25rem; }
    .btn-primary { background-color: #0284c7; color: white; padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 600; }
    .btn-primary:hover { background-color: #0369a1; }
  </style>
</head>
<body class="p-4 max-w-4xl mx-auto">
  <header class="text-center py-6 border-b border-slate-700 mb-6">
    <h1 class="text-3xl font-bold text-sky-400">NDOLI APP DEVELOPER</h1>
    <p class="text-slate-400 text-sm mt-1">Mobile & Web App Builder | Kinyarwanda & English</p>
  </header>

  <main class="space-y-6">
    <section class="card text-center">
      <h2 class="text-xl font-bold text-white mb-2">Asoumpta's Bar Manager App</h2>
      <p class="text-slate-300 text-sm mb-4">Icuruzwa, Ububiko n'Inyungu ku Mufuka Wanjye</p>
      <div class="grid grid-cols-2 gap-4 text-left">
        <div class="bg-slate-900 p-3 rounded">
          <p class="text-xs text-slate-400">Umusaruro (Revenue)</p>
          <p class="text-lg font-bold text-green-400">0 RWF</p>
        </div>
        <div class="bg-slate-900 p-3 rounded">
          <p class="text-xs text-slate-400">Ububiko (Stock Items)</p>
          <p class="text-lg font-bold text-sky-400">0 Drinks</p>
        </div>
      </div>
    </section>

    <section class="card">
      <h3 class="text-lg font-bold mb-3 text-sky-300">Ongeramo Igicuruzwa Gishya (Add New Item)</h3>
      <form onsubmit="alert('App saved!'); return false;" class="space-y-3">
        <input type="text" placeholder="Izina ry'Igicuruzwa (e.g. Primus)" class="w-full p-2 rounded bg-slate-900 border border-slate-700 text-white text-sm" required>
        <div class="grid grid-cols-2 gap-2">
          <input type="number" placeholder="Igiciro cyo Kurangura" class="p-2 rounded bg-slate-900 border border-slate-700 text-white text-sm" required>
          <input type="number" placeholder="Igiciro cyo Kugurisha" class="p-2 rounded bg-slate-900 border border-slate-700 text-white text-sm" required>
        </div>
        <button type="submit" class="w-full btn-primary mt-2">Bika Igicuruzwa (Save Item)</button>
      </form>
    </section>
  </main>
</body>
</html>
